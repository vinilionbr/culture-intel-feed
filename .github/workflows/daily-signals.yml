name: Daily Intelligence Feed

on:
  schedule:
    # 9:00 AM Brisbane (AEST = UTC+10) = 23:00 UTC previous day
    - cron: '0 23 * * *'
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          DISCORD_WEBHOOK_SOCIAL:  ${{ secrets.DISCORD_WEBHOOK_SOCIAL }}
          DISCORD_WEBHOOK_CULTURE: ${{ secrets.DISCORD_WEBHOOK_CULTURE }}
          DISCORD_WEBHOOK_TRENDS:  ${{ secrets.DISCORD_WEBHOOK_TRENDS }}
          DISCORD_WEBHOOK_AI:      ${{ secrets.DISCORD_WEBHOOK_AI }}
          DISCORD_WEBHOOK_WEB3:    ${{ secrets.DISCORD_WEBHOOK_WEB3 }}
          DISCORD_WEBHOOK_JOBS:    ${{ secrets.DISCORD_WEBHOOK_JOBS }}
          DISCORD_WEBHOOK_UPWORK:  ${{ secrets.DISCORD_WEBHOOK_UPWORK }}
          TIMEZONE: Australia/Brisbane
        run: node index.js --now
