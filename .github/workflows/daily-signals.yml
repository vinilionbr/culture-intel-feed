name: SCOUT Refresh

# On-demand only. There is NO schedule, so this never runs on its own
# and never costs you anything unless YOU trigger it from the Actions tab.
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # allows pushing docs/data.json back to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh signals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          TIMEZONE: Australia/Brisbane
        run: node index.js

      - name: Commit dashboard data
        if: always()
        run: |
          git config user.name "SCOUT"
          git config user.email "scout@github-actions"
          git add docs/data.json signal-history.json
          git diff --staged --quiet || (git commit -m "chore: refresh signals [skip ci]" && git push)
