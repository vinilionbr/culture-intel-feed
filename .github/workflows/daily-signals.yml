name: Daily Intelligence Feed

on:
  schedule:
    # 7:00 AM Brisbane (AEST = UTC+10) = 21:00 UTC previous day
    - cron: '0 21 * * *'
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          SLACK_WEBHOOK_SOCIAL: ${{ secrets.SLACK_WEBHOOK_SOCIAL }}
          SLACK_WEBHOOK_CULTURE: ${{ secrets.SLACK_WEBHOOK_CULTURE }}
          SLACK_WEBHOOK_AI: ${{ secrets.SLACK_WEBHOOK_AI }}
          SLACK_WEBHOOK_WEB3: ${{ secrets.SLACK_WEBHOOK_WEB3 }}
          TIMEZONE: Australia/Brisbane
        run: node index.js --now
