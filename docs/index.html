<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Culture Scout — Cultural Intelligence Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0471DE; --ink:#001426; --linen:#FBFAF2;
  --navy:#004A80; --signal:#3D9BFF; --sky:#62BBF9;
  --mist:#F4F1E6; --line:#E5E0D0; --slate:#586D84;
  --display:'Archivo',Inter,system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--linen);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
a{color:var(--blue);text-decoration:none}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;font-size:11px}

/* Header */
header{position:sticky;top:0;z-index:10;background:rgba(251,250,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.head-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:66px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:28px;height:28px;color:var(--ink)}
.brand .wm{font-family:var(--display);font-weight:900;letter-spacing:-.02em;font-size:19px;line-height:1}
.brand .sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-top:2px}
.updated{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--slate);text-align:right}
.updated b{color:var(--ink);font-weight:500}
.refresh-btn{border:1px solid var(--line);background:transparent;color:var(--ink);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:11px;padding:9px 14px;border-radius:var(--r);cursor:pointer}
.refresh-btn:hover{border-color:var(--ink)}

/* Controls */
.controls{padding:22px 0 14px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:11px;padding:7px 13px;border:1px solid var(--line);border-radius:99px;background:var(--linen);color:var(--slate);cursor:pointer}
.chip.active{background:var(--blue);border-color:var(--blue);color:var(--linen)}
.controls-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;font-family:var(--body);font-size:14px;background:var(--linen);color:var(--ink)}
.search:focus{outline:none;border-color:var(--blue)}
.toggle{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:11px;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--linen);color:var(--slate);cursor:pointer}
.toggle.on{background:var(--ink);border-color:var(--ink);color:var(--linen)}

/* Day / channel groups */
.day{margin-top:34px}
.day-label{font-family:var(--display);font-weight:900;letter-spacing:-.02em;font-size:26px;margin-bottom:4px}
.day-sub{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);margin-bottom:18px}
.chan-label{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.chan-label .tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.chan-label .rule{height:1px;flex:1;background:var(--line)}

/* Cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--linen);padding:20px;display:flex;flex-direction:column;gap:12px}
.card.fav{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.card h3{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.25}
.card .block .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);display:block;margin-bottom:3px}
.card .block p{font-size:14px;color:var(--ink);line-height:1.5}
.card .why p{color:var(--slate)}
.card .src{font-family:var(--mono);font-size:11px;letter-spacing:.04em;word-break:break-all}
.card .src a{color:var(--blue)}
.card-actions{display:flex;gap:8px;margin-top:auto;padding-top:6px;border-top:1px solid var(--line)}
.act{border:1px solid var(--line);background:transparent;border-radius:var(--r);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;cursor:pointer;color:var(--slate)}
.act:hover{border-color:var(--ink);color:var(--ink)}
.act.on{background:var(--blue);border-color:var(--blue);color:var(--linen)}
.note{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;font-family:var(--body);font-size:13px;background:var(--mist);color:var(--ink);resize:vertical;min-height:38px;display:none}
.note.show{display:block}

.empty{text-align:center;padding:90px 20px;color:var(--slate)}
.empty h2{font-family:var(--display);font-weight:900;font-size:26px;color:var(--ink);margin-bottom:12px;letter-spacing:-.02em}
.empty code{font-family:var(--mono);font-size:13px;background:var(--mist);border:1px solid var(--line);padding:3px 8px;border-radius:var(--r);color:var(--ink)}
footer{border-top:1px solid var(--line);margin-top:50px;padding:26px 0;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
</style>
</head>

<header>
  <div class="wrap head-inner">
    <div class="brand">
      <svg><use href="#lion"/></svg>
      <div>
        <div class="wm">Culture Scout</div>
        <div class="sub">Cultural Intelligence Briefing</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <div class="updated" id="updated"></div>
      <button class="refresh-btn" id="howto">How to refresh</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="controls" id="controls" style="display:none">
    <div class="chips" id="chips"></div>
    <div class="controls-row">
      <input class="search" id="search" placeholder="Search signals...">
      <button class="toggle" id="favToggle">★ Favorites</button>
      <button class="toggle" id="hiddenToggle">Show hidden</button>
    </div>
  </div>
  <div id="feed"></div>
</div>

<footer><div class="wrap">Culture Scout · A LionCreative system · Refreshes daily · Your notes and stars are saved in this browser only</div></footer>

<script>
const CH = {
  social:  'Social',
  culture: 'Culture',
  trends:  'Trends',
  ai:      'AI',
  web3:    'Web3',
};
const CUR_KEY = 'scout-curation';
let curation = JSON.parse(localStorage.getItem(CUR_KEY) || '{}');
let state = { channel: 'all', q: '', favOnly: false, showHidden: false };
let DATA = { signals: [] };

const sid = s => `${s.date}|${s.channel}|${(s.headline||'').slice(0,60)}`;
const saveCur = () => localStorage.setItem(CUR_KEY, JSON.stringify(curation));
const getCur = id => curation[id] || {};

function fmtDate(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

async function load(){
  try{
    const res = await fetch('data.json?' + Date.now());
    if(!res.ok) throw new Error('no data');
    DATA = await res.json();
  }catch(e){ DATA = { signals: [] }; }
  render();
}

function render(){
  const feed = document.getElementById('feed');
  const updated = document.getElementById('updated');
  const controls = document.getElementById('controls');

  if(!DATA.signals || DATA.signals.length === 0){
    controls.style.display = 'none';
    updated.innerHTML = '';
    feed.innerHTML = `<div class="empty"><h2>No signals yet</h2>
      <p>Run a refresh to pull the latest.</p>
      <p style="margin-top:16px">On your machine: <code>node index.js</code><br>then commit and push, or trigger the GitHub refresh.</p></div>`;
    return;
  }
  controls.style.display = 'block';
  updated.innerHTML = DATA.updated ? `Updated<br><b>${new Date(DATA.updated).toLocaleString('en-AU',{timeZone:'Australia/Brisbane',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</b>` : '';

  // channel chips
  const channels = [...new Set(DATA.signals.map(s=>s.channel))];
  const chips = document.getElementById('chips');
  chips.innerHTML = ['all', ...channels].map(c =>
    `<button class="chip ${state.channel===c?'active':''}" data-ch="${c}">${c==='all'?'All':(CH[c]||c)}</button>`
  ).join('');
  chips.querySelectorAll('.chip').forEach(el => el.onclick = () => { state.channel = el.dataset.ch; render(); });

  // filter
  let rows = DATA.signals.filter(s=>{
    const c = getCur(sid(s));
    if(c.hidden && !state.showHidden) return false;
    if(state.favOnly && !c.fav) return false;
    if(state.channel!=='all' && s.channel!==state.channel) return false;
    if(state.q){
      const hay = `${s.headline} ${s.why} ${s.what}`.toLowerCase();
      if(!hay.includes(state.q.toLowerCase())) return false;
    }
    return true;
  });

  // group by date desc, then channel
  const byDate = {};
  rows.forEach(s=>{ (byDate[s.date] = byDate[s.date] || []).push(s); });
  const dates = Object.keys(byDate).sort().reverse();

  feed.innerHTML = dates.map(date=>{
    const dayRows = byDate[date];
    const chans = [...new Set(dayRows.map(s=>s.channel))];
    const chanBlocks = chans.map(ch=>{
      const cards = dayRows.filter(s=>s.channel===ch).map(cardHTML).join('');
      return `<div class="chan-label"><span class="tag">${CH[ch]||ch}</span><span class="rule"></span></div><div class="grid">${cards}</div>`;
    }).join('');
    return `<div class="day"><div class="day-label">${fmtDate(date)}</div><div class="day-sub">${dayRows.length} signal${dayRows.length>1?'s':''}</div>${chanBlocks}</div>`;
  }).join('');

  // wire card actions
  feed.querySelectorAll('[data-act]').forEach(el=>{
    el.onclick = () => {
      const id = el.dataset.id, act = el.dataset.act;
      const c = curation[id] = curation[id] || {};
      if(act==='fav') c.fav = !c.fav;
      if(act==='hide') c.hidden = !c.hidden;
      if(act==='note'){ const ta = document.querySelector(`textarea[data-id="${CSS.escape(id)}"]`); ta.classList.toggle('show'); ta.focus(); return; }
      saveCur(); render();
    };
  });
  feed.querySelectorAll('textarea[data-id]').forEach(ta=>{
    ta.oninput = () => { const c = curation[ta.dataset.id] = curation[ta.dataset.id]||{}; c.note = ta.value; saveCur(); };
  });
}

function cardHTML(s){
  const id = sid(s); const c = getCur(id);
  const esc = t => (t||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  return `<div class="card ${c.fav?'fav':''}">
    <h3>${esc(s.headline)}</h3>
    ${s.why?`<div class="block why"><span class="lbl">Why it matters</span><p>${esc(s.why)}</p></div>`:''}
    ${s.what?`<div class="block"><span class="lbl">What to do</span><p>${esc(s.what)}</p></div>`:''}
    ${s.source?`<div class="src">🔗 <a href="${esc(s.source)}" target="_blank" rel="noopener">${esc(s.source)}</a></div>`:''}
    <textarea class="note ${c.note?'show':''}" data-id="${id}" placeholder="Your note...">${esc(c.note||'')}</textarea>
    <div class="card-actions">
      <button class="act ${c.fav?'on':''}" data-act="fav" data-id="${id}">★ ${c.fav?'Saved':'Save'}</button>
      <button class="act" data-act="note" data-id="${id}">✎ Note</button>
      <button class="act" data-act="hide" data-id="${id}">${c.hidden?'Unhide':'Hide'}</button>
    </div>
  </div>`;
}

document.getElementById('search').oninput = e => { state.q = e.target.value; render(); };
document.getElementById('favToggle').onclick = e => { state.favOnly = !state.favOnly; e.target.classList.toggle('on', state.favOnly); render(); };
document.getElementById('hiddenToggle').onclick = e => { state.showHidden = !state.showHidden; e.target.classList.toggle('on', state.showHidden); render(); };
document.getElementById('howto').onclick = () => alert('Culture Scout refreshes automatically every morning.\\n\\nWant fresh signals right now?\\n  • Run  npm run refresh  in the project folder, or\\n  • Trigger "Culture Scout Refresh" in the GitHub Actions tab.\\n\\nThe dashboard updates about a minute later.');

load();
</script>
